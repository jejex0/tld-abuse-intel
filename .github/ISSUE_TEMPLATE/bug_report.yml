name: Bug report
description: Report a reproducible failure in the pipeline, scoring, or outputs
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please include enough detail to reproduce the problem. Raw downloads are
        not committed, so note whether you used `--reuse` or a fresh collection.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the failure or unexpected output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands run, in order.
      render: shell
      placeholder: |
        python3 -m venv .venv
        source .venv/bin/activate
        pip install -r requirements.txt
        make all
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant output or traceback
      render: shell
    validations:
      required: false
