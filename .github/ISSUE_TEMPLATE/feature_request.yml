name: Feature request
description: Suggest a new feed, metric, output format, or model improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gap or use case.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: Data sources or references
      description: For new feeds or metrics, include public URLs, licensing, and refresh cadence.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Model constraints
      options:
        - label: The proposal keeps results reproducible and source-attributed.
          required: true
        - label: The proposal does not turn this project into a production blocklist.
          required: true
